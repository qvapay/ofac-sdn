name: Community list import

# Rebuild the community list whenever a report issue changes state — the
# moderation act is swapping the `pendiente` label for `aprobado` (or closing /
# unlabeling to retract). Only issues carrying `reporte-comunidad` trigger it.
on:
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, deleted]
  workflow_dispatch:

concurrency:
  group: community-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'reporte-comunidad')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build community list from approved issues and upload to R2
        run: node scripts/import-lists.mjs community --upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ secrets.R2_KEY }}

      # Warm Fluid instances cache the dataset in memory forever; a redeploy
      # recycles them so the API picks up the new index immediately.
      - name: Trigger Vercel redeploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "Vercel redeploy triggered"
          else
            echo "VERCEL_DEPLOY_HOOK_URL not set, skipping redeploy"
          fi
