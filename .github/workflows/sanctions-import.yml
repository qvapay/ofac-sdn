name: Sanctions lists import (UN, EU, UK)

# These lists change often (new designations land weekly), so refresh daily —
# unlike the Cuban rosters, which only need the Monday run.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: sanctions-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download and upload UN + EU + UK lists to R2
        run: node scripts/import-lists.mjs un eu uk --upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ secrets.R2_KEY }}

      # Warm Fluid instances cache the dataset in memory forever; a redeploy
      # recycles them so the API picks up the new index immediately.
      - name: Trigger Vercel redeploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "Vercel redeploy triggered"
          else
            echo "VERCEL_DEPLOY_HOOK_URL not set, skipping redeploy"
          fi
